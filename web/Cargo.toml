[package]
name = "bloody_a90_web"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bloody_a90 = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Must equal the wasm-bindgen CLI version used by web/build.sh.
wasm-bindgen = "=0.2.128"
