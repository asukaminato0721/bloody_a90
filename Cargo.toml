[package]
name = "bloody_a90"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["web"]

# The browser build (web/) uses only the configuration modules of the library.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ab_glyph = "0.2.32"
eframe = "0.37.0"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
libloading = "0.8.9"
roxmltree = "0.21.1"
tiny-skia = "0.12.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
x11rb = { version = "0.13.2", features = ["shape", "xtest"] }
zbus = "5.19.0"
